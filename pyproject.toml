[tool.poetry]
name = "cltg"
version = "1.2.0"
description = "Family Telegram bot powered by Claude API"
authors = ["CLTG"]
readme = "README.md"
packages = [{include = "bot"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
aiogram = "^3.31.0"
anthropic = "^1.12.0"
httpx2 = "^2.13.1"
python-dotenv = "^1.2.4"
aiosqlite = "^0.22.1"
tzdata = ">=2026.5"
pillow = "^12.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
