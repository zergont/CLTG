use_default_settings: true

search:
  formats:
    - html
    - json        # обязательно для HTTP API

server:
  secret_key: "REPLACE_WITH_GENERATED_KEY"
  limiter: false  # бот — единственный клиент, лимиты не нужны
  image_proxy: false

outgoing:
  request_timeout: 10.0

# С IP дата-центра Google («access denied»), DuckDuckGo и Startpage (капча),
# Brave (429) и Qwant не отвечают. Яндекс и Bing работают — включаем их.
# Бот всё равно передаёт движки явно (SEARXNG_ENGINES), это — для веб-интерфейса.
engines:
  - name: yandex
    disabled: false
  - name: bing
    disabled: false
  - name: google
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: startpage
    disabled: true
  - name: qwant
    disabled: true
